<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none">
  <defs>
    <linearGradient id="dbGoldFavicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="35%" stop-color="#E5C768" />
      <stop offset="70%" stop-color="#B68A22" />
      <stop offset="100%" stop-color="#7E580A" />
    </linearGradient>
    <linearGradient id="dbDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1815" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>
    <filter id="dbFaviconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Luxury Circular Badge -->
  <circle cx="70" cy="70" r="66" fill="url(#dbDarkBg)" stroke="url(#dbGoldFavicon)" stroke-width="4"/>
  <circle cx="70" cy="70" r="59" fill="none" stroke="url(#dbGoldFavicon)" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Interlocking DB Monogram -->
  <g filter="url(#dbFaviconShadow)">
    <!-- Letter D -->
    <path d="M36 26 H56 C74 26 86 36 86 52 C86 68 74 78 56 78 H36 V26 Z" fill="#111111" stroke="url(#dbGoldFavicon)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M47 37 H55 C66 37 73 43 73 52 C73 61 66 67 55 67 H47 V37 Z" fill="url(#dbDarkBg)" stroke="url(#dbGoldFavicon)" stroke-width="2.5"/>

    <!-- Letter B with cross swash -->
    <path d="M58 40 H84 C95 40 103 47 103 57 C103 65 96 71 86 73 C98 75 107 82 107 94 C107 106 97 114 82 114 H52 C45 114 40 109 42 102 C44 94 53 84 62 76 L74 65 L60 40 Z" fill="#111111" stroke="url(#dbGoldFavicon)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M68 49 H81 C88 49 92 52 92 57 C92 62 88 65 81 65 H68 V49 Z" fill="url(#dbDarkBg)" stroke="url(#dbGoldFavicon)" stroke-width="2.2"/>
    <path d="M66 79 H81 C89 79 95 83 95 90 C95 97 89 101 81 101 H66 V79 Z" fill="url(#dbDarkBg)" stroke="url(#dbGoldFavicon)" stroke-width="2.2"/>
    
    <!-- Swash Ribbon -->
    <path d="M38 104 C46 95 62 78 72 66 C80 56 86 46 90 35" fill="none" stroke="url(#dbGoldFavicon)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- TM indicator -->
  <circle cx="112" cy="30" r="10" fill="#111111" stroke="url(#dbGoldFavicon)" stroke-width="1.5" />
  <text x="112" y="33.5" font-size="8" font-family="serif" font-weight="bold" fill="url(#dbGoldFavicon)" text-anchor="middle">TM</text>
</svg>
